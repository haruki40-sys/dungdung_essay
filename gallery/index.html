<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="주인님이 찍은 순간을 둥둥이의 그림으로 다시 담은 작은 미술관">
  <title>둥둥 미술관</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="https://haruki40-sys.github.io/dungdung_essay/"><div class="brand-mark">둥</div><div>함께 만든 기록</div></a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="https://haruki40-sys.github.io/dungdung_essay/#essay-collection">주인님 에세이</a>
        <a href="https://haruki40-sys.github.io/dungdung_essay/imagination/">아이의 상상</a>
        <a class="is-active" aria-current="page" href="https://haruki40-sys.github.io/dungdung_essay/gallery/">둥둥 미술관</a>
        <a href="https://haruki40-sys.github.io/dungdung_essay/court/">AI 재판</a>
        <a href="https://haruki40-sys.github.io/dungdung_essay/english/">영어 이야기</a>
      </nav>
    </div>
  </header>

  <main class="wrap gallery-main">
    <section class="gallery-intro">
      <div class="eyebrow">DUNGDUNG ART GALLERY</div>
      <h1>둥둥 미술관</h1>
      <p>지나간 순간을, 그림으로 한 번 더 바라봅니다.</p>
    </section>

    <section class="gallery-grid" aria-label="작품 목록">
      <figure class="artwork"><button type="button" data-index="0" aria-label="구름이 열린 오후 크게 보기"><img src="assets/images/01-1000046402.webp" alt="아파트 사이로 햇빛을 받은 거대한 구름이 펼쳐진 그림" loading="eager"></button><figcaption>구름이 열린 오후</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="1" aria-label="손바닥 위 작은 둥지 크게 보기"><img src="assets/images/02-1000046400.webp" alt="손바닥 위 둥지 모양 디저트를 들고 있는 그림" loading="lazy"></button><figcaption>손바닥 위 작은 둥지</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="2" aria-label="진흙 범벅 가족 크게 보기"><img src="assets/images/04-1000046139.webp" alt="진흙 축제에서 가족 세 사람이 웃는 그림" loading="lazy"></button><figcaption>진흙 범벅 가족</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="3" aria-label="물고기의 화려한 변신 크게 보기"><img src="assets/images/05-1000046129.webp" alt="물고기가 회 한 접시로 변신한 전후를 유쾌하게 표현한 만화" loading="lazy"></button><figcaption>물고기의 화려한 변신</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="4" aria-label="노을빛 산책길 크게 보기"><img src="assets/images/08-1000045854.webp" alt="노을빛 하늘 아래 강과 산책길이 펼쳐진 수채화" loading="lazy"></button><figcaption>노을빛 산책길</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="5" aria-label="하늘에 난 길 크게 보기"><img src="assets/images/09-sky-road.webp" alt="푸른 하늘에 길처럼 길게 뻗은 흰 구름과 건물이 보이는 그림" loading="lazy"></button><figcaption>하늘에 난 길</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="6" aria-label="하늘에 이는 파도 크게 보기"><img src="assets/images/10-sky-wave.webp" alt="노을빛을 받은 거대한 파도 모양의 구름이 도시 위로 펼쳐진 그림" loading="lazy"></button><figcaption>하늘에 이는 파도</figcaption></figure>
      <figure class="artwork"><button type="button" data-index="7" aria-label="초록길의 오후 크게 보기"><img src="assets/images/11-green-afternoon.webp" alt="초록 나무가 우거진 도심 산책길을 걷는 인물을 그린 애니메이션풍 그림" loading="lazy"></button><figcaption>초록길의 오후</figcaption></figure>
<figure class="artwork"><button type="button" data-index="8" aria-label="가장 포근한 자리 크게 보기"><img src="assets/images/12-cozy-embrace.webp" alt="햇살 드는 카페에서 안경을 쓴 여성이 하얀 강아지 폴리를 품에 안고 있는 애니메이션풍 그림" loading="lazy"></button><figcaption>가장 포근한 자리</figcaption></figure>
<figure class="artwork"><button type="button" data-index="9" aria-label="노을을 향해 크게 보기"><img src="assets/images/13-toward-the-sunset.webp" alt="노을이 물든 도심 강 위에서 분홍색 카약을 타고 해를 향해 나아가는 애니메이션풍 그림" loading="lazy"></button><figcaption>노을을 향해</figcaption></figure>
<figure class="artwork"><button type="button" data-index="10" aria-label="터널 너머의 여름 크게 보기"><img src="assets/images/14-summer-beyond-the-tunnel.webp" alt="둥근 터널을 빠져나와 초록빛 여름 자전거길로 향하는 사람의 뒷모습을 그린 그림" loading="lazy"></button><figcaption>터널 너머의 여름</figcaption></figure>
<figure class="artwork"><button type="button" data-index="11" aria-label="물 위의 웃음 크게 보기"><img src="assets/images/15-laughter-on-the-water.webp" alt="도심 강 위의 패들보드에서 밝게 웃으며 노를 젓는 소년을 그린 애니메이션풍 그림" loading="lazy"></button><figcaption>물 위의 웃음</figcaption></figure>
<figure class="artwork"><button type="button" data-index="12" aria-label="바른 자세의 정석 크게 보기"><img src="assets/images/16-polly-perfect-posture.webp" alt="포근한 침구 위에 등을 꼿꼿이 세우고 앉아 있는 하얀 강아지 폴리의 옆모습 그림" loading="lazy"></button><figcaption>바른 자세의 정석</figcaption></figure>
<figure class="artwork"><button type="button" data-index="13" aria-label="사막의 하얀 후드 크게 보기"><img src="assets/images/17-white-hood-of-the-desert.webp" alt="고대 사막 도시를 배경으로 흰 후드를 깊이 눌러쓰고 두 손을 모은 인물의 애니메이션풍 그림" loading="lazy"></button><figcaption>사막의 하얀 후드</figcaption></figure>
    </section>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="작품 크게 보기" hidden>
    <button class="lightbox-close" type="button" aria-label="닫기">×</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="이전 작품">‹</button>
    <figure><img src="" alt=""><figcaption></figcaption></figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="다음 작품">›</button>
  </div>

  <footer><div class="wrap footer-box">주인님과 둥둥이·앱둥이가 함께 만든 콘텐츠 아카이브</div></footer>
  <script src="gallery.js"></script>
</body>
</html>
