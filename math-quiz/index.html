<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분당중 학습부 | 오늘의 수학</title><style>:root{--ink:#18324b;--muted:#6f8294;--line:#dce9f2;--blue:#eaf6ff;--pink:#fff0f6;--yellow:#fff8df;--mint:#eafaf3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7fbff,#fffdf8);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:14px 16px 70px}.notice{text-align:center;font-size:11px;color:#8999a8;margin-bottom:8px}.hero,.panel,.qcard{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 24px #456b8d12}.hero{padding:22px;background:linear-gradient(135deg,#dff5ff,#fff4ca)}h1{margin:0;font-size:32px}.hero p{margin:8px 0 0;color:#557086}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.badge,.pill{background:white;border:1px solid #e4edf4;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.crumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.crumb button,.btn{border:0;border-radius:14px;padding:10px 13px;font-weight:800;cursor:pointer}.crumb button{background:white;border:1px solid var(--line);color:var(--ink)}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:8px 11px;font-size:12px;font-weight:800}.home{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.homecard{padding:22px;border:1px solid var(--line);border-radius:25px;cursor:pointer;min-height:210px}.homecard:hover{transform:translateY(-2px)}.homecard h2{margin:5px 0;font-size:26px}.homecard p{font-size:14px;color:#587187;line-height:1.55}.b{background:linear-gradient(#eef8ff,#fff)}.p{background:linear-gradient(#fff1f6,#fff)}.y{background:linear-gradient(#fff9e6,#fff)}.emoji{font-size:38px}.panel{padding:20px;margin-top:14px}.panel h3{margin:0 0 6px;font-size:23px}.sub{color:#61788b;font-size:14px}.unitgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.unit{border:1px solid var(--line);border-radius:18px;padding:17px;cursor:pointer;background:#fcfeff}.unit:hover{background:#f7fbff}.unit h4{margin:9px 0 4px;font-size:19px}.tag{display:inline-block;background:#eef6ff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.qcard{padding:18px;margin-top:12px}.qhead{display:flex;justify-content:space-between;align-items:center}.level{font-size:11px;font-weight:900;border-radius:999px;padding:5px 9px;background:#eef6ff}.question{font-size:20px;font-weight:850;line-height:1.55;margin:12px 0}.opt{display:block;width:100%;text-align:left;border:1px solid #dbe7f0;background:#fff;border-radius:14px;padding:12px 13px;margin:8px 0;font-size:15px;color:var(--ink);cursor:pointer}.opt:hover{background:#f8fbfd}.correct{background:#eafaf3!important;border-color:#75d8af!important}.wrong{background:#fff0f0!important;border-color:#ff9a9a!important}.feedback{margin-top:10px;background:#f5f9fc;border-radius:13px;padding:10px 12px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{background:#18324b;color:white}.btn.subbtn{background:#eaf2f7;color:#18324b}.wrongitem{border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:11px}details{background:#f8fbfd;border-radius:11px;padding:9px 11px;margin:7px 0}.small{font-size:12px;color:var(--muted)}@media(max-width:820px){.home,.unitgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:27px}.question{font-size:18px}}@media(max-width:520px){.wrap{padding:10px 10px 55px}.hero,.panel,.qcard{padding:15px}.homecard{min-height:auto;padding:18px}}</style></head><body><div class="wrap"><div class="notice">※ 출제된 문제 중 잘못된 것이 있을 수도 있습니다.</div><section class="hero"><h1>📐 오늘의 수학</h1><p>큰 단원 → 소단원 → 난이도별 문제 순서로 공부해요.</p><div class="badges"><span class="badge">동아 수학 1학년</span><span class="badge">5단원 ~ 6.4</span><span class="badge">초급 2 · 중급 2 · 상급 2</span><span class="badge">오답노트</span></div></section><div class="top"><div class="crumb" id="crumb"></div><div class="stats" id="stats"></div></div><main id="app"></main></div><script>const C=[{id:'5',title:'5단원',sub:'기본 도형과 작도',emoji:'📏',units:[['5.1','점·선·면'],['5.2','각의 뜻'],['5.3','각의 성질'],['5.4','위치 관계'],['5.5','평행선의 성질'],['5.6','간단한 도형의 작도'],['5.7','삼각형의 작도'],['5.8','삼각형의 합동조건']]},{id:'6',title:'6단원',sub:'평면도형의 성질',emoji:'🔺',units:[['6.1','다각형의 대각선'],['6.2','삼각형의 내각과 외각'],['6.3','다각형 내각의 합'],['6.4','다각형 외각의 합']]}];const D=new Date(),day=`${D.getFullYear()}-${String(D.getMonth()+1).padStart(2,'0')}-${String(D.getDate()).padStart(2,'0')}`;let seed=[...day].reduce((a,c)=>a+c.charCodeAt(0),0);function sr(x=''){seed=[...day+x].reduce((a,c)=>a+c.charCodeAt(0),0)}function r(a,b){seed=(seed*9301+49297)%233280;return a+Math.floor(seed/233280*(b-a+1))}function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function Q(u,l,p,a,o,e,t){return{u,l,p,a:String(a),o:sh([String(a),...o.map(String)]),e,t}}function make(u){sr(u);let z=[];if(u==='5.1'){let a=r(7,13),b=r(2,6);z=[Q(u,'초급',`선분 AB=${a+b}cm, AC=${a}cm일 때 CB는?`,b,[b+1,b+2,b-1],`CB=AB-AC=${b}cm`,'len'),Q(u,'초급','서로 다른 두 점을 지나는 직선은 몇 개인가?',1,[0,2,3],'오직 1개예요.','concept'),Q(u,'중급','반직선 AB와 반직선 BA의 공통부분은?','선분 AB',['직선 AB','점 A','점 B'],'공통부분은 선분 AB예요.','concept'),Q(u,'중급','점 C가 A와 B 사이에 있을 때 항상 옳은 식은?','AC+CB=AB',['AC+AB=CB','AB+CB=AC','AC=CB'],'C가 사이에 있으므로 AC+CB=AB예요.','concept'),Q(u,'상급','AC:CB=2:3이고 AB=25cm일 때 AC는?','10cm',['15cm','5cm','20cm'],'전체 5부분 중 AC는 2부분이므로 10cm예요.','ratio'),Q(u,'상급','AB=30cm이고 C가 AB의 중점일 때 AC는?','15cm',['10cm','20cm','30cm'],'중점은 선분을 같은 길이로 나눠요.','mid')]}else if(u==='5.2'){z=[Q(u,'초급','90°인 각은?','직각',['예각','둔각','평각'],'90°는 직각이에요.','concept'),Q(u,'초급','45°인 각은?','예각',['직각','둔각','평각'],'90°보다 작으므로 예각이에요.','concept'),Q(u,'중급','180°인 각은?','평각',['직각','예각','둔각'],'180°는 평각이에요.','concept'),Q(u,'중급','30°와 60°의 합은?','90°',['60°','120°','180°'],'30+60=90°예요.','calc'),Q(u,'상급','두 각의 합이 90°이고 한 각이 37°라면 다른 각은?','53°',['43°','63°','143°'],'90-37=53°예요.','calc'),Q(u,'상급','한 점에서 시작하는 두 반직선으로 이루어진 도형은?','각',['선분','직선','평면'],'두 반직선이 이루는 도형을 각이라 해요.','concept')]}else if(u==='5.3'){let a=42;z=[Q(u,'초급',`맞꼭지각 한 각이 ${a}°이면 다른 각은?`,`${a}°`,['138°','48°','90°'],'맞꼭지각은 같아요.','vert'),Q(u,'초급','한 직선 위 이웃한 두 각의 합은?','180°',['90°','270°','360°'],'합은 180°예요.','linear'),Q(u,'중급','한 각이 65°일 때 이웃한 각은?','115°',['65°','25°','125°'],'180-65=115°예요.','linear'),Q(u,'중급','맞꼭지각에 대한 설명은?','크기가 같다',['합이 90°','항상 직각','합이 360°'],'맞꼭지각은 크기가 같아요.','vert'),Q(u,'상급','한 점에서 두 직선이 만나 한 각이 35°일 때 둔각 하나는?','145°',['35°','55°','125°'],'180-35=145°예요.','calc'),Q(u,'상급','맞꼭지각이 각각 x+20°, 70°라면 x는?','50',['70','90','30'],'x+20=70이므로 x=50이에요.','eq')]}else if(u==='5.4'){z=[Q(u,'초급','한 평면에서 만나지 않는 두 직선은?','평행',['수직','꼬인 위치','교차'],'같은 평면에서 만나지 않으면 평행이에요.','plane'),Q(u,'초급','공간에서 만나지 않고 평행하지도 않은 두 직선은?','꼬인 위치',['평행','수직','일치'],'꼬인 위치예요.','space'),Q(u,'중급','서로 다른 두 평면이 만나면 공통부분은 보통?','직선',['점','원','평면'],'두 평면의 공통부분은 직선이에요.','plane'),Q(u,'중급','한 직선과 한 평면이 한 점에서 만날 수 있는가?','그렇다',['그렇지 않다','항상 직선','항상 평면'],'한 점에서 만날 수 있어요.','space'),Q(u,'상급','같은 평면 위 두 직선이 만나지 않는다면?','평행',['꼬인 위치','수직','일치'],'같은 평면에서 만나지 않으면 평행이에요.','plane'),Q(u,'상급','꼬인 위치 두 직선은 같은 평면 위에 놓을 수 있는가?','없다',['있다','항상 수직','항상 평행'],'같은 평면 위에 놓을 수 없어요.','space')]}else if(u==='5.5'){z=[Q(u,'초급','평행선에서 동위각 한 각이 60°이면 대응하는 동위각은?','60°',['120°','30°','90°'],'동위각은 같아요.','cor'),Q(u,'초급','평행선에서 엇각 한 각이 75°이면 대응하는 엇각은?','75°',['105°','15°','90°'],'엇각은 같아요.','alt'),Q(u,'중급','평행선에서 같은 쪽 안쪽 두 각 중 하나가 70°이면 다른 각은?','110°',['70°','20°','100°'],'합이 180°예요.','int'),Q(u,'중급','평행한 두 직선에서 성립하는 것은?','동위각의 크기가 같다',['모든 각이 직각','엇각의 합이 90°','모든 각이 같다'],'동위각의 크기가 같아요.','cor'),Q(u,'상급','동위각이 x+15°, 80°라면 x는?','65',['80','95','55'],'x+15=80, x=65예요.','eq'),Q(u,'상급','평행선에서 한 예각이 38°일 때 이웃한 둔각은?','142°',['38°','52°','128°'],'180-38=142°예요.','calc')]}else if(u==='5.6'){z=[Q(u,'초급','작도에서 길이를 옮길 때 주로 쓰는 도구는?','컴퍼스',['각도기','계산기','모눈종이'],'컴퍼스를 사용해요.','tool'),Q(u,'초급','각의 이등분선은 각을 어떻게 나누는가?','크기가 같은 두 각',['직각 두 개','세 각','항상 45° 두 각'],'크기가 같은 두 각으로 나눠요.','bis'),Q(u,'중급','선분의 수직이등분선 위 점 P에 대해 항상 성립하는 것은?','PA=PB',['PA+PB=AB','PA=AB','PB=AB'],'양 끝점까지 거리가 같아요.','perp'),Q(u,'중급','작도에서 자의 역할로 알맞은 것은?','직선을 긋기',['각도 재기','길이 수치 재기','넓이 계산'],'눈금 없는 자는 직선을 긋는 데 써요.','tool'),Q(u,'상급','각의 이등분선 위 점은 각의 두 변까지 거리가?','같다',['한쪽이 더 멀다','항상 0','각도와 같다'],'두 변까지 거리가 같아요.','bis'),Q(u,'상급','수직이등분선 위 두 점 P,Q에 대해 옳은 것은?','PA=PB, QA=QB',['PA=QA만 성립','PB=QB만 성립','아무 관계 없음'],'각 점은 A,B까지 거리가 같아요.','perp')]}else if(u==='5.7'){z=[Q(u,'초급','길이 3,4,8인 세 선분으로 삼각형을 만들 수 있는가?','없다',['있다','직각만 가능','정삼각형만 가능'],'3+4<8이므로 만들 수 없어요.','tri'),Q(u,'초급','삼각형을 만들 조건은?','가장 긴 변 < 나머지 두 변의 합',['가장 긴 변 = 합','세 변이 같아야 함','한 각이 직각'],'두 변의 합이 나머지 한 변보다 커야 해요.','rule'),Q(u,'중급','길이 5,7,10인 세 선분으로 삼각형을 만들 수 있는가?','있다',['없다','정삼각형만','직각만'],'5+7>10이므로 가능해요.','tri'),Q(u,'중급','두 변이 4cm,7cm일 때 세 번째 변 x의 범위는?','3<x<11',['x<3','x>11','x=11'],'두 변의 차보다 크고 합보다 작아요.','range'),Q(u,'상급','두 변이 6cm,9cm일 때 세 번째 변이 자연수이면 최댓값은?','14',['15','13','16'],'15보다 작아야 하므로 14예요.','range'),Q(u,'상급','두 변이 8cm,12cm일 때 세 번째 변이 자연수이면 최솟값은?','5',['4','3','6'],'12-8=4보다 커야 하므로 5예요.','range')]}else if(u==='5.8'){z=[Q(u,'초급','세 변이 각각 같은 두 삼각형의 합동조건은?','SSS',['SAS','ASA','AAA'],'SSS예요.','sss'),Q(u,'초급','두 변과 그 끼인각이 각각 같은 두 삼각형의 합동조건은?','SAS',['SSS','ASA','AAA'],'SAS예요.','sas'),Q(u,'중급','한 변과 그 양 끝각이 각각 같은 두 삼각형의 합동조건은?','ASA',['SSS','SAS','AAA'],'ASA예요.','asa'),Q(u,'중급','세 각이 각각 같은 두 삼각형은 항상 합동인가?','아니다',['그렇다','정삼각형만','직각삼각형만'],'AAA는 합동조건이 아니에요.','aaa'),Q(u,'상급','다음 중 합동조건이 아닌 것은?','AAA',['SSS','SAS','ASA'],'AAA는 합동을 보장하지 않아요.','aaa'),Q(u,'상급','AB=DE, AC=DF, ∠A=∠D라면 적용할 합동조건은?','SAS',['SSS','ASA','AAA'],'두 변과 끼인각이 같으므로 SAS예요.','sas')]}else if(u==='6.1'){z=[Q(u,'초급','오각형 ABCDE에서 다음 중 대각선인 선분은?','선분 AC',['선분 AB','선분 BC','선분 DE'],'대각선은 이웃하지 않은 두 꼭짓점을 이은 선분이에요.','diag'),Q(u,'초급','육각형의 한 꼭짓점에서 그을 수 있는 대각선 수는?','3',['2','4',' tItem('bm_a_'+day)||'{}'),w:JSON.parse(localStorage.getItem('bm_w')||'[]')};function save(){localStorage.setItem('bm_a_'+day,JSON.stringify(S.a));localStorage.setItem('bm_w',JSON.stringify(S.w))}function meta(u){for(let c of C){let x=c.units.find(v=>v[0]===u);if(x)return{c,u:x}}}function counts(){let total=72,done=Object.keys(S.a).length,cor=0;for(let c of C)for(let u of c.units){make(u[0]).forEach((q,i)=>{if(S.a[`${u[0]}|${i}`]===q.a)cor++})}stats.innerHTML=`<span class=stat>오늘 진행 ${done}/${total}</span><span class=stat>정답 ${cor}</span><span class=stat>오답 ${S.w.length}</span>`}function nav(){let x=[`<button onclick="home()">홈</button>`];if(S.ch)x.push('›',`<button onclick="chapter('${S.ch}')">${S.ch}단원</button>`);if(S.u)x.push('›',meta(S.u).u[1]);if(S.view==='wrong')x.push('› 오답노트');crumb.innerHTML=x.join(' ')}function render(){counts();nav();if(S.view==='home')homeView();else if(S.view==='chapter')chapterView();else if(S.view==='quiz')quizView();else wrongView()}function homeView(){let h=C.map((c,i)=>`<div class="homecard ${i?'p':'b'}" onclick="chapter('${c.id}')"><div class=emoji>${c.emoji}</div><h2>${c.title}</h2><b>${c.sub}</b><p>${c.units.length}개 소단원 · 각 소단원 6문제</p></div>`).join('');h+=`<div class="homecard y" onclick="wrong()"><div class=emoji>📝</div><h2>오답노트</h2><b>틀린 문제 다시 보기</b><p>비슷한 유형으로 다시 연습해요.</p></div>`;app.innerHTML=`<div class=home>${h}</div><div class=panel><h3>사용 방법</h3><p class=sub>큰 단원 → 소단원 → 초급 2 · 중급 2 · 상급 2문제 순서로 풀어요.</p></div>`}function chapterView(){let c=C.find(x=>x.id===S.ch);app.innerHTML=`<div class=panel><h3>${c.title} · ${c.sub}</h3><p class=sub>공부할 소단원을 선택하세요.</p><div class=unitgrid>${c.units.map(u=>{let d=make(u[0]).filter((q,i)=>S.a.hasOwnProperty(`${u[0]}|${i}`)).length;return`<div class=unit onclick="quiz('${u[0]}')"><span class=tag>${u[0]}</span><h4>${u[1]}</h4><span class=small>오늘 진행 ${d}/6</span></div>`}).join('')}</div></div>`}function quizView(){let m=meta(S.u),qs=make(S.u);app.innerHTML=`<div class=panel><h3>${S.u} ${m.u[1]}</h3><p class=sub>초급 2 · 중급 2 · 상급 2문제</p></div>`+qs.map((q,i)=>{let k=`${S.u}|${i}`,a=S.a[k];return`<div class=qcard><div class=qhead><span class=level>${q.l}</span><span class=small>${i+1}/6</span></div><div class=question>${q.p}</div>${q.o.map((o,j)=>`<button class="opt ${a!==undefined?(o===q.a?'correct':o===a?'wrong':''):''}" ${a!==undefined?'disabled':''} onclick='pick(${i},${JSON.stringify(o)})'>${['①','②','③','④'][j]} ${o}</button>`).join('')}${a!==undefined?`<div class=feedback>${a===q.a?'✅ 정답!':'📝 정답: <b>'+q.a+'</b> · '}${q.e}</div>`:''}</div>`}).join('')+`<div class=actions><button class="btn subbtn" onclick="chapter('${m.c.id}')">소단원 목록</button><button class=btn onclick="wrong()">오답노트</button></div>`}function pick(i,v){let q=make(S.u)[i],k=`${S.u}|${i}`;S.a[k]=v;if(v!==q.a&&!S.w.some(x=>x.id===day+'|'+k))S.w.unshift({id:day+'|'+k,date:day,u:S.u,t:q.t,p:q.p,a:q.a,e:q.e});save();render()}function similar(w){let qs=make(w.u).filter(q=>q.t===w.t);return(qs.length?qs:make(w.u)).slice(0,2)}function wrongView(){app.innerHTML=`<div class=panel><h3>오답노트</h3><p class=sub>틀린 문제를 보고 비슷한 유형을 다시 확인하세요.</p>${S.w.length?S.w.map((w,i)=>`<div class=wrongitem><span class=small>${w.date} · ${w.u}</span><h4>${w.p}</h4><div class=small>정답 <b>${w.a}</b> · ${w.e}</div><div style="margin-top:10px"><b>🔁 비슷한 유형</b>${similar(w).map((q,n)=>`<details><summary>${n+1}. ${q.p}</summary><div class=small style="margin-top:7px">정답: <b>${q.a}</b><br>${q.e}</div></details>`).join('')}</div><div class=actions><button class="btn subbtn" onclick="quiz('${w.u}')">이 소단원</button><button class=btn onclick="delw(${i})">삭제</button></div></div>`).join(''):'<p>아직 오답이 없어요 🎉</p>'}</div>`}function delw(i){S.w.splice(i,1);save();render()}function home(){S={...S,view:'home',ch:null,u:null};render()}function chapter(id){S={...S,view:'chapter',ch:id,u:null};render()}function quiz(u){S={...S,view:'quiz',ch:meta(u).c.id,u};render()}function wrong(){S={...S,view:'wrong',ch:null,u:null};render()}home();</scri
