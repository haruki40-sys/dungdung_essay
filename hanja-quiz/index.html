<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>한자성어 랜덤 퀴즈 · 독음 · 겉뜻 · 속뜻</title>
<style>
:root {
  --green:#03c75a;
  --green-dark:#00a94f;
  --ink:#111;
  --muted:#6b7280;
  --line:#e5e7eb;
  --soft:#f7f9fa;
  --blue:#2b6cb0;
  --yellow:#fff8d6;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  background:#f3f5f7;
  color:var(--ink);
}
.wrap { max-width:760px; margin:0 auto; min-height:100vh; background:#fff; }
header {
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
  padding:14px 18px 12px;
}
.brand { display:flex; align-items:center; gap:10px; font-weight:900; }
.brand .logo { color:var(--green); font-size:24px; letter-spacing:-1px; }
.brand .sub { font-size:15px; color:#444; font-weight:700; }
.search {
  margin-top:12px; border:2px solid var(--green); border-radius:10px;
  padding:12px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.search b { color:var(--green); }
.search span { color:#555; font-size:14px; }
main { padding:18px; }
.toolbar {
  display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap;
  margin-bottom:14px;
}
.pill {
  background:#eefbf4; color:var(--green-dark); border:1px solid #c9f0d8;
  border-radius:999px; padding:7px 10px; font-size:13px; font-weight:800;
}
.progress { color:var(--muted); font-size:13px; }
.card {
  border:1px solid var(--line); border-radius:14px; overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.04); background:#fff;
}
.card-head { padding:16px 18px; border-bottom:1px solid var(--line); background:#fafafa; }
.card-head .label { font-size:13px; color:var(--muted); margin-bottom:5px; }
.card-head .hanja {
  font-family:"Noto Serif KR","Batang","Songti SC",serif;
  font-size:44px; font-weight:700; letter-spacing:8px; text-align:center; padding:18px 0 12px;
}
.prompt {
  text-align:center; font-size:15px; color:#444; margin-top:4px;
}
.answer {
  display:none; padding:18px; background:#fff;
}
.answer.show { display:block; }
.row { display:grid; grid-template-columns:90px 1fr; gap:10px; padding:11px 0; border-bottom:1px solid #f0f1f2; }
.row:last-child { border-bottom:none; }
.key { font-weight:800; color:#3f4954; }
.value { line-height:1.55; overflow-wrap:anywhere; min-width:0; }
.answer-guide { margin-bottom:6px; padding:10px 12px; background:#f2faf5; border-radius:8px; color:#436052; font-size:13px; line-height:1.6; }
.sentence-meanings { margin-top:10px; }
.sentence-meanings .row { border-color:#ece5bd; font-size:14px; }
.sentence-meanings .row:last-child { border-bottom:0; }
.actions {
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;
}
button {
  appearance:none; border:none; border-radius:10px; padding:14px 12px;
  font-size:15px; font-weight:900; cursor:pointer;
}
.primary { background:var(--green); color:#fff; }
.secondary { background:#eef1f4; color:#222; }
.good { background:#eefbf4; color:#067a39; border:1px solid #c9f0d8; }
.bad { background:#fff1f2; color:#b42318; border:1px solid #ffd4d7; }
.scorebox {
  display:none; margin-top:18px; padding:18px; background:#fbfcfd;
  border:1px solid var(--line); border-radius:14px;
}
.scorebox.show { display:block; }
.scoregrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
.stat { text-align:center; padding:12px 8px; border-radius:10px; background:#fff; border:1px solid var(--line); }
.stat b { display:block; font-size:22px; margin-bottom:4px; }
.sentence {
  margin-top:18px; padding:18px; border:1px solid #f0df8d; background:var(--yellow); border-radius:14px;
}
.sentence h3 { margin:0 0 8px; font-size:17px; }
.sentence .target {
  font-family:"Noto Serif KR","Batang",serif; font-size:28px; font-weight:800; margin:10px 0 6px;
}
.sentence small { color:#665c2f; }
.footer-note { text-align:center; color:#89919a; font-size:12px; padding:24px 12px 30px; }
@media (max-width:520px) {
  .card-head .hanja { font-size:36px; letter-spacing:5px; }
  .row { grid-template-columns:72px 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="logo">한자사전</div>
    <div class="sub">랜덤 퀴즈</div>
  </div>
  <div class="search">
    <b>Q</b>
    <span>한자만 보고 독음 · 겉뜻 · 속뜻을 맞혀 보세요.</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="pill">35개 전부 랜덤 출제</div>
    <div class="progress" id="progress">1 / 35</div>
  </div>

  <section class="card">
    <div class="card-head">
      <div class="label">오늘의 한자성어</div>
      <div class="hanja" id="hanja">竹馬故友</div>
      <div class="prompt">소리 내어 읽고, 겉뜻과 속뜻을 말한 뒤 정답을 확인하세요.</div>
    </div>

    <div class="answer" id="answer" aria-live="polite">
      <div class="answer-guide">겉뜻은 한자를 풀어 쓴 뜻, 속뜻은 실제로 쓰이는 뜻이에요.</div>
      <div class="row"><div class="key">독음</div><div class="value" id="reading"></div></div>
      <div class="row"><div class="key">겉뜻</div><div class="value" id="literalMeaning"></div></div>
      <div class="row"><div class="key">속뜻</div><div class="value" id="meaning"></div></div>
    </div>
  </section>

  <div class="actions" id="mainActions">
    <button class="primary" id="revealBtn">정답 보기</button>
    <button class="secondary" id="shuffleBtn">다른 문제</button>
  </div>

  <div class="actions" id="gradeActions" style="display:none;">
    <button class="good" id="correctBtn">맞았어요 ✓</button>
    <button class="bad" id="wrongBtn">헷갈렸어요</button>
  </div>

  <section class="scorebox" id="scorebox">
    <h3 style="margin:0;">퀴즈 완료 🎉</h3>
    <div class="scoregrid">
      <div class="stat"><b id="correctStat">0</b><span>정답</span></div>
      <div class="stat"><b id="wrongStat">0</b><span>헷갈림</span></div>
      <div class="stat"><b>35</b><span>총 문제</span></div>
    </div>
    <button class="primary" id="restartBtn" style="width:100%;">처음부터 다시</button>
  </section>

  <section class="sentence" id="sentenceBox" style="display:none;">
    <h3>마지막 미션 · 문장 만들기</h3>
    <div>아래 한자성어를 넣어 자연스러운 문장 하나를 만들어 보세요.</div>
    <div class="target" id="sentenceTarget"></div>
    <div class="sentence-meanings">
      <div class="row"><div class="key">겉뜻</div><div class="value" id="sentenceLiteralMeaning"></div></div>
      <div class="row"><div class="key">속뜻</div><div class="value" id="sentenceMeaning"></div></div>
    </div>
    <div class="actions" style="margin-top:14px;">
      <button class="secondary" id="rerollSentence">다른 성어 뽑기</button>
      <button class="primary" id="showExampleBtn">예시 문장 보기</button>
    </div>
    <div id="exampleBox" style="display:none;margin-top:12px;padding:12px 14px;background:#fff;border-radius:10px;border:1px solid #eadf9b;line-height:1.6;"></div>
  </section>

  <div class="footer-note">모든 문제는 페이지를 열 때마다 무작위 순서로 섞입니다.</div>
</main>
</div>

let order = [];
let idx = 0;
let correct = 0;
let wrong = 0;
let current = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newSession() {
  order = shuffle(DATA.map((_,i)=>i));
  idx = 0; correct = 0; wrong = 0;
  document.getElementById('scorebox').classList.remove('show');
  document.getElementById('sentenceBox').style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  if (idx >= order.length) return finish();
  current = DATA[order[idx]];
  document.getElementById('hanja').textContent = current.hanja;
  document.getElementById('reading').textContent = current.reading;
  document.getElementById('literalMeaning').textContent = current.literalMeaning;
  document.getElementById('meaning').textContent = current.meaning;
  document.getElementById('answer').classList.remove('show');
  document.getElementById('mainActions').style.display = 'grid';
  document.getElementById('gradeActions').style.display = 'none';
  document.getElementById('progress').textContent = `${idx+1} / ${DATA.length}`;
}

function reveal() {
  document.getElementById('answer').classList.add('show');
  document.getElementById('mainActions').style.display = 'none';
  document.getElementById('gradeActions').style.display = 'grid';
}

function next(mark) {
  if (mark === 'correct') correct++;
  if (mark === 'wrong') wrong++;
  idx++;
  loadQuestion();
}

function skipRandom() {
  if (idx >= order.length-1) return;
  const swapWith = idx + 1 + Math.floor(Math.random() * (order.length - idx - 1));
  [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
  loadQuestion();
}

function finish() {
  document.getElementById('mainActions').style.display = 'none';
  document.getElementById('gradeActions').style.display = 'none';
  document.getElementById('answer').classList.remove('show');
  document.getElementById('hanja').textContent = '완료';
  document.getElementById('progress').textContent = '35 / 35';
  document.getElementById('correctStat').textContent = correct;
  document.getElementById('wrongStat').textContent = wrong;
  document.getElementById('scorebox').classList.add('show');
  document.getElementById('sentenceBox').style.display = 'block';
  pickSentence();
}

function pickSentence() {
  const item = DATA[Math.floor(Math.random()*DATA.length)];
  document.getElementById('sentenceTarget').textContent = `${item.hanja} · ${item.reading}`;
  document.getElementById('sentenceLiteralMeaning').textContent = item.literalMeaning;
  document.getElementById('sentenceMeaning').textContent = item.meaning;
  document.getElementById('exampleBox').style.display = 'none';
  document.getElementById('showExampleBtn').dataset.reading = item.reading;
  document.getElementById('showExampleBtn').dataset.meaning = item.meaning;
}

  return samples[reading] || `${reading}의 뜻을 생각하며 자연스러운 문장을 만들어 보세요.`;

document.getElementById('revealBtn').onclick = reveal;
