<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>한자성어 퀴즈</title><style>*{box-sizing:border-box}[hidden]{display:none}body{margin:0;background:#f4f7f5;font-family:Arial,"Noto Sans KR",sans-serif;color:#18232b}.w{max-width:720px;margin:auto;min-height:100vh;background:white}header,main{padding:16px}header{padding-bottom:0;border-bottom:1px solid #ddd}.logo{font-size:24px;font-weight:900;color:#087b3b}.v{float:right;font-size:11px;color:#087b3b}nav{display:flex;margin-top:12px}nav button{flex:1;border:0;border-bottom:3px solid transparent;background:white;padding:11px 2px;font-weight:bold;color:#68747c}nav .on{color:#087b3b;border-color:#03c75a}.box{background:#f5fcf8;border:1px solid #cfe7d8;border-radius:12px;padding:14px}.count{font-size:44px;font-weight:900;color:#087b3b;margin:7px 0}.count small{font-size:23px;color:#728b7a}progress{width:100%;accent-color:#03c75a}.card{border:1px solid #e1e7e3;border-radius:12px;margin-top:12px;overflow:hidden}.head{padding:16px;background:#fafcfb}.hanja{text-align:center;font-family:Batang,serif;font-size:clamp(38px,10vw,56px);letter-spacing:.12em;margin:25px 0}.small{font-size:12px;color:#68747c}.ans{padding:14px}.row{display:grid;grid-template-columns:55px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.key{font-weight:bold}.reading{font-size:20px;font-weight:bold;color:#087b3b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:8px;padding:12px 7px;font-weight:bold}.p{background:#03c75a}.s{background:#edf1ef}.g{background:#eaf8ef;color:#087439}.b{background:#fff0eb;color:#a13d28}.done,.empty{padding:20px;border:1px solid #cfe7d8;border-radius:12px;background:#f5fcf8}.search{width:100%;padding:11px;border:2px solid #03c75a;border-radius:8px}.entry{padding:12px;border-bottom:1px solid #eee}.entry h3{font-family:Batang,serif;margin:0}.write{background:#fff9df;border-radius:10px;padding:13px;margin:10px 0}textarea{width:100%;min-height:80px}.badge{font-size:10px;background:#eaf8ef;border-radius:8px;padding:1px 4px}</style><div class=w><header><span class=logo>한자사전</span><span class=v>v4.0</span><div class=small>35문제 → 오답만 랜덤 퀴즈 → 문장 만들기</div><nav><button data-v=q class=on>랜덤 퀴즈</button><button data-v=w>오답 퀴즈 <i id=badge class=badge hidden></i></button><button data-v=s>전체 35개</button><button data-v=m>문장 만들기</button></nav></header><main><section id=q><div id=qp><div class=box><b>35개 전부 · 랜덤</b><div class=count><span id=qn>1</span><small>/35</small></div><progress id=qb max=35></progress><div id=qs class=small></div></div><div class=card><div class=head><div class=small>독음 · 겉뜻 · 속뜻을 맞혀 보세요.</div><h1 id=qh class=hanja></h1></div><div id=qa class=ans hidden></div></div><div id=qm class=actions><button class="btn p" onclick="showA('q')">정답 보기</button><button class="btn s" onclick="later('q')">나중에</button></div><div id=qg class=actions hidden><button class="btn g" onclick="mark(1)">맞았어요 ✓</button><button class="btn b" onclick="mark(0)">틀림 · 헷갈림</button></div></div><div id=qd class=done hidden><h2>35/35 완료!</h2><p id=qr></p><button id=go class="btn p">오답 퀴즈 시작</button></div></section><section id=w hidden><div id=we class=empty>아직 오답이 없어요.<br>먼저 35문제를 풀어 주세요.</div><div id=wp hidden><div class=box><b>오답만 · 랜덤 성어 맞추기</b><div class=count><span id=wn>1</span><small id=wt></small></div><progress id=wb></progress><div id=ws class=small></div></div><div class=card><div class=head><div class=small>이번에는 맞혀 보세요.</div><h1 id=wh class=hanja></h1></div><div id=wa class=ans hidden></div></div><div id=wm class=actions><button class="btn p" onclick="showA('w')">정답 보기</button><button class="btn s" onclick="later('w')">나중에</button></div><div id=wg class=actions hidden><button class="btn g" onclick="wmark(1)">이제 알아요 ✓</button><button class="btn b" onclick="wmark(0)">아직 헷갈려요</button></div></div><div id=wd class=done hidden><h2 id=wtitle></h2><p id=wr></p><button id=again class= const D=[['竹馬故友','죽마고우','대나무 말을 타고 놀던 옛 친구','어릴 때부터 함께 자란 친한 친구'],['莫逆之友','막역지우','서로 거스름이 없는 친구','허물없이 매우 친한 친구'],['知己之友','지기지우','자기를 알아주는 친구','서로의 마음을 잘 알아주는 친한 친구'],['敎學相長','교학상장','가르치고 배우면서 서로 성장함','가르치는 사람과 배우는 사람이 서로 발전함'],['晝耕夜讀','주경야독','낮에는 밭을 갈고 밤에는 책을 읽음','어려운 환경에서도 열심히 공부함'],['螢雪之功','형설지공','반딧불과 눈빛으로 공부한 공','어려운 환경을 이겨 내며 열심히 공부하여 얻은 성과'],['手不釋卷','수불석권','손에서 책을 놓지 않음','늘 책을 가까이하며 열심히 공부함'],['四面楚歌','사면초가','사방에서 초나라 노래가 들림','아무에게도 도움받지 못하는 어려운 상황'],['吾鼻三尺','오비삼척','내 코가 석 자임','자기 일도 급해서 남을 도울 형편이 못 됨'],['坐井觀天','좌정관천','우물에 앉아서 하늘을 봄','견문이 좁아 세상을 넓게 보지 못함'],['愚公移山','우공이산','우공이 산을 옮김','꾸준히 노력하면 큰일도 이루어 낼 수 있음'],['過猶不及','과유불급','지나친 것은 모자란 것과 같음','무엇이든 지나치면 좋지 않음'],['群鷄一鶴','군계일학','닭 무리 속의 한 마리 학','많은 사람 가운데 특히 뛰어난 사람'],['塞翁之馬','새옹지마','변방 노인의 말','인생의 길흉화복은 예측하기 어려움'],['始終一貫','시종일관','처음부터 끝까지 하나로 꿰뚫음','처음부터 끝까지 태도나 행동이 한결같음'],['信賞必罰','신상필벌','상을 확실히 주고 벌을 반드시 줌','공이 있으면 상을 주고 잘못하면 반드시 벌함'],['我田引水','아전인수','자기 논에 물을 끌어들임','자기에게만 유리하도록 생각하거나 행동함'],['溫故知新','온고지신','옛것을 익혀 새것을 앎','옛것을 배우고 익혀 새로운 것을 깨달음'],['靑山流水','청산유수','푸른 산과 흐르는 물','말이 막힘없이 아주 유창함'],['靑出於藍','청출어람','푸른빛이 쪽에서 나옴','제자가 스승보다 더 뛰어남'],['風樹之嘆','풍수지탄','바람에 흔들리는 나무의 탄식','부모님께 효도하지 못한 채 여읜 슬픔과 후회'],['鶴首苦待','학수고대','학처럼 목을 길게 빼고 애타게 기다림','몹시 간절하게 기다림'],['無用之物','무용지물','쓸모가 없는 물건','아무런 쓸모가 없음'],['自初至終','자초지종','처음부터 끝까지','어떤 일이 처음부터 끝까지 진행된 모든 과정'],['以熱治熱','이열치열','열로써 열을 다스림','더운 것을 더운 것으로 이겨 냄'],['畫龍點睛','화룡점정','용을 그린 뒤 눈동자를 찍음','가장 중요한 부분을 더해 일을 완성함'],['狐假虎威','호가호위','여우가 호랑이의 위세를 빌림','남의 힘을 빌려 위세를 부림'],['自業自得','자업자득','자기가 한 일의 결과를 자기가 얻음','자기가 저지른 일의 결과를 자기가 받음'],['異口同聲','이구동성','서로 다른 입에서 같은 소리가 남','여러 사람이 한결같이 같은 말을 함'],['臥薪嘗膽','와신상담','섶에 눕고 쓸개를 맛봄','목적을 이루려고 어려움을 참고 견딤'],['龍頭蛇尾','용두사미','용의 머리와 뱀의 꼬리','시작은 좋지만 끝이 좋지 않음'],['有終之美','유종지미','끝맺음의 아름다움이 있음','일을 끝까지 잘 마무리함'],['人之常情','인지상정','사람의 보통 감정','누구나 자연스럽게 가지는 마음'],['作心三日','작심삼일','마음먹은 것이 사흘뿐임','결심이 오래가지 못함'],['走馬看山','주마간산','말을 달리며 산을 봄','자세히 살피지 않고 대충 훑어봄']];const $=x=>document.getElementById(x),K='hq4';let M,W,B=[];try{B=JSON.parse(localStorage.getItem(K)||'[]').filter(x=>D[x])}catch(e){}function save(){try{localStorage.setItem(K,JSON.stringify(B))}catch(e){}}function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function A(i){let d=D[i];return `<div class=row><b class=key>독음</b><div class=reading>${d[1]}</div></div><div class=row><b>겉뜻</b><div>${d[2]}</div></div><div class=row><b>속뜻</b><div>${d[3]}</div></div>`}function V(v){['q','w','s','m'].forEach(x=>$(x).hidden=x!=v);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='w')WH()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>V(b.dataset.v));function startMain(){M={o:sh(D.map((_,i)=>i)),i:0,r:{}};$('qp').hidden=0;$('qd').hidden=1;V('q');QM()}function QM(){let id=M.o[M.i];$('qn').textContent=M.i+1;$('qb').value=M.i;$('qs').textContent=`푼 문제 ${M.i}개 · 남은 문제 ${35-M.i}개`;$('qh').textContent=D[id][0];$('qa').innerHTML=A(id);$('qa').hidden=1;$('qm').hidden=0;$('qg').hidden=1}function showA(x){$(x+'a').hidden=0;$(x+'m').hidden=1;$(x+'g').hidden=0}function later(x){let S=x=='q'?M:W;if(S.i>=S.o.length-1)return;S.o.push(S.o.splice(S.i,1)[0]);x=='q'?QM():QW()}function mark(ok){M.r[M.o[M.i]]=ok;M.i++;if(M.i<35)QM();else{B=M.o.filter(i=>!M.r[i]);save();badge();$('qp').hidden=1;$('qd').hidden=0;$('good').textContent=35-B.length;$('bad').textContent=B.length;$('qr').textContent=B.length?`오답 ${B.length}개를 랜덤으로 다시 풀어봐요.`:'전부 맞았어요!';$('go').disabled=!B.length}}$('go').onclick=()=>startWrong(B);function badge(){$('badge').hidden=!B.length;$('badge').textContent=B.length}function WH(){$('we').hidden=!!B.length;$('wp').hidden=1;$('wd').hidden=1;if(B.length)startWrong(B)}function startWrong(ids){if(!ids.length){V('w');$('we').hidden=0;return}W={o:sh(ids),i:0,r:{}};V('w');$('we').hidden=1;$('wp').hidden=0;$('wd').hidden=1;QW()}function QW(){let id=W.o[W.i],n=W.o.length;$('wn').textContent=W.i+1;$('wt').textContent='/'+n;$('wb').max=n;$('wb').value=W.i;$('ws').textContent=`오답 ${n}개 중 ${W.i+1}번째`;$('wh').textContent=D[id][0];$('wa').innerHTML=A(id);$('wa').hidden=1;$('wm').hidden=0;$('wg').hidden=1}function wmark(ok){W.r[W.o[W.i]]=ok;W.i++;if(W.i<W.o.length)QW();else{let left=W.o.filter(i=>!W.r[i]);B=left;save();badge();$('wp').hidden=1;$('wd').hidden=0;$('wtitle').textContent=left.length?'오답 퀴즈 한 바퀴 완료!':'오답노트 클리어 🎉';$('wr').textContent=left.length?`아직 헷갈리는 ${left.length}개만 다시 랜덤 출제할게요.`:'이번 오답을 모두 맞혔어요.';$('again').hidden=!left.length;$('again').onclick=()=>startWrong(left)}}function render(){let q=$('search').value.trim();$('list').innerHTML=D.map((d,i)=>({d,i})).filter(x=>!q||x.d.join(' ').includes(q)).map(x=>`<div class=entry><h3>${x.d[0]} <b>${x.d[1]}</b
