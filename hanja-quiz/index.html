<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한자성어 35 퀴즈</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f7f5;font-family:Arial,"Noto Sans KR",sans-serif;color:#18232b}.w{max-width:720px;margin:auto;min-height:100vh;background:#fff}header,main{padding:16px}header{padding-bottom:0;border-bottom:1px solid #ddd}.logo{font-size:24px;font-weight:900;color:#087b3b}.v{float:right;font-size:11px;color:#087b3b}nav{display:flex;margin-top:12px}nav button{flex:1;border:0;border-bottom:3px solid transparent;background:#fff;padding:11px 2px;font-weight:bold;color:#68747c}nav .on{color:#087b3b;border-color:#03c75a}.box{background:#f5fcf8;border:1px solid #cfe7d8;border-radius:12px;padding:14px}.count{font-size:44px;font-weight:900;color:#087b3b;margin:7px 0}.count small{font-size:23px;color:#728b7a}progress{width:100%;accent-color:#03c75a}.small{font-size:12px;color:#68747c}.card{border:1px solid #e1e7e3;border-radius:12px;margin-top:12px;overflow:hidden}.head{padding:16px;background:#fafcfb}.hanja{text-align:center;font-family:Batang,serif;font-size:clamp(38px,10vw,56px);letter-spacing:.12em;margin:25px 0}.ans{padding:14px}.row{display:grid;grid-template-columns:55px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.reading{font-size:20px;font-weight:bold;color:#087b3b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:8px;padding:12px 7px;font-weight:bold}.p{background:#03c75a}.s{background:#edf1ef}.g{background:#eaf8ef;color:#087439}.b{background:#fff0eb;color:#a13d28}.done,.empty{padding:20px;border:1px solid #cfe7d8;border-radius:12px;background:#f5fcf8}.search{width:100%;padding:11px;border:2px solid #03c75a;border-radius:8px}.entry{padding:12px;border-bottom:1px solid #eee}.entry h3,.write h3{font-family:Batang,serif;margin:0 0 5px;font-size:24px}.write{background:#fff9df;border-radius:10px;padding:13px;margin:10px 0}textarea{width:100%;min-height:80px}.badge{font-size:10px;background:#eaf8ef;border-radius:8px;padding:1px 4px}</style></head><body><div class="w"><header><span class="logo">한자사전</span><span class="v">v4.0</span><div class="small">35문제 → 오답만 랜덤 퀴즈 → 문장 만들기</div><nav><button data-v="q" class="on">랜덤 퀴즈</button><button data-v="w">오답 퀴즈 <i id="badge" class="badge" hidden></i></button><button data-v="s">전체 35개</button><button data-v="m">문장 만들기</button></nav></header><main><section id="q"><div id="qp"><div class="box"><b>35개 전부 · 랜덤</b><div class="count"><span id="qn">1</span><small>/35</small></div><progress id="qb" max="35"></progress><div id="qs" class="small"></div></div><div class="card"><div class="head"><div class="small">독음 · 겉뜻 · 속뜻을 맞혀 보세요.</div><h1 id="qh" class="hanja"></h1></div><div id="qa" class="ans" hidden></div></div><div id="qm" class="actions"><button class="btn p" onclick="showA('q')">정답 보기</button><button class="btn s" onclick="later('q')">나중에</button></div><div id="qg" class="actions" hidden><button class="btn g" onclick="mark(1)">맞았어요 ✓</button><button class="btn b" onclick="mark(0)">틀림 · 헷갈림</button></div></div><div id="qd" class="done" hidden><h2>35/35 완료!</h2><p id="qr"></p><button id="go" class="btn p">오답 퀴즈 시작</button></div></section><section id="w" hidden><div id="we" class="empty">아직 오답이 없어요.<br>먼저 35문제를 풀어 주세요.</div><div id="wp" hidden><div class="box"><b>오답만 · 랜덤 성어 맞추기</b><div class="count"><span id="wn">1</span><small id="wt"></small></div><progress id="wb"></progress><div id="ws" class="small"></div></div><div class="card"><div class="head"><div class="small">이번에는 맞혀 보세요.</div><h1 id="wh" class="hanja"></h1></div><div id="wa" class="ans" hidden></div></div><div id="wm" class="actions"><button class="btn p" onclick="showA('w')">정답 보기</button><button class="btn s" onclick="later('w')">나중에</button></div><div id="wg" class="actions" hidden><button class="btn g" onclick="wmark(1)">이제 알아요 ✓</button><button class="btn b" onclick="wmark(0)">아직 헷갈려요</button></div></div><div id="wd" class="done" hidden><h2 id="wtitle"></h2><p id="wr"></p><button id="again" class="btn b">남은 오답 다시</button></div></section><section id="s" hidden><h2>전체 35개</h2><input id="search" class="search" placeholder="한자, 독음 또는 뜻 검색"><div id="list"></div></section><section id="m" hidden><h2>문장 만들기</h2><button class="btn g" onclick="mission()">랜덤 2개 다시 뽑기</button><div id="missions"></div></section></main></div><script src="quiz.js?v=4"></script></body></html>
