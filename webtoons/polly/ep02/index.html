<body>
  <div class="reader">
    <header id="top">
      <h1>폴리와 함께 하는 느긋한 이세계 여행</h1>
      <p>EP.02 비가 깨우는 도시 · 5페이지 · 20컷</p>
    </header>
    <main aria-label="EP.02 비가 깨우는 도시 웹툰">
      <img src="images/ep02-p01.webp" width="1024" height="1536" fetchpriority="high" alt="1페이지. 윤과 폴리가 마른 운하와 닫힌 시장을 둘러본다. 윤: 여기가… 물의 도시라고요? 오늘 쉬는 날인가? 노인: 아직 문 열 날씨가 아니네. 윤: …비?">
      <img src="images/ep02-p02.webp" width="1024" height="1536" loading="lazy" alt="2페이지. 비가 오자 시장이 깨어난다. 폴리가 물웅덩이로 들어갔다가 뒤로 나타나고, 윤은 소리 병 가게를 구경한다. 윤: 비가 오니까… 도시가 깨어나! 폴리?! 상인: 지름길이야. 처음이지? 이건 파도 소리란다.">
      <img src="images/ep02-p03.webp" width="793" height="1983" loading="lazy" alt="3페이지. 상인이 우산잎을 빌려준다. 폴리는 비를 맞는 배달새에게 우산잎을 씌워준다. 상인: 우산잎 빌려줄게. 갈 때 돌려주렴. 윤: 폴리, 어디 가? 아… 얘한테 씌워주려고?">
      <img src="images/ep02-p04.webp" width="793" height="1983" loading="lazy" alt="4페이지. 배달새를 따라 우체국에 간 윤이 부모에게 편지를 남긴다. 윤: 따라오라는 거야? 엄마 아빠를 찾고 있어요. 직원: 편지를 남겨볼래? 편지: 엄마, 아빠. 저랑 폴리는 무사해요. 꼭 만나요. 윤. 직원: 다른 쉼터에도 전해줄게. 윤: 감사합니다.">
      <img src="images/ep02-p05.webp" width="793" height="1983" loading="lazy" alt="5페이지. 우산잎을 돌려주고 빵을 받은 윤과 폴리가 비가 잦아드는 도시를 바라본다. 윤: 잘 썼어요. 감사합니다! 상인: 길에서 먹으렴. 윤: 벌써 그치네… 비가 조금만 더 왔으면 좋겠다.">
    </main>
