<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="폴리와 함께 하는 느긋한 이세계 여행 — EP.01 미리보기. 가족여행에서 시작된 윤과 폴리의 이야기, 5페이지·20컷.">
  <meta name="color-scheme" content="light">
  <title>EP.01 미리보기 · 폴리와 함께 하는 느긋한 이세계 여행</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f7fa; color: #173f5f; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
    .reader { width: 100%; max-width: 760px; margin: 0 auto; background: #fff; }
    header { padding: 22px 18px 18px; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.6; word-break: keep-all; }
    header p { margin: 5px 0 0; color: #617789; font-size: 13px; line-height: 1.6; }
    main img { display: block; width: 100%; height: auto; }
    main img + img { margin-top: 16px; }
    footer { padding: 28px 16px 36px; text-align: center; }
    footer a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 1px solid #c8d9e2; border-radius: 6px; color: #173f5f; font-size: 14px; text-decoration: none; }
    footer a:hover { background: #f3f7fa; }
    footer a:focus-visible { outline: 3px solid #0f766e; outline-offset: 4px; }
  </style>
</head>
<body>
  <div class="reader">
    <header id="top">
      <h1>폴리와 함께 하는 느긋한 이세계 여행</h1>
      <p>EP.01 미리보기 · 5페이지 · 20컷</p>
    </header>
    <main aria-label="EP.01 미리보기 웹툰">
      <img src="images/ep01-p01.webp" width="793" height="1983" fetchpriority="high" alt="1페이지. 가족여행 중인 윤과 폴리. 터널에 들어선 차가 이상한 빛에 휩싸인다. 윤: 아직 멀었어요? 부모: 조금만 더 가면 돼. 윤: 어… 저 빛은 뭐지? 폴리!">
      <img src="images/ep01-p02.webp" width="793" height="1983" loading="lazy" alt="2페이지. 낯선 숲에서 깨어난 윤이 부모를 찾다가 폴리와 재회한다. 윤: 여긴… 어디지? 엄마! 아빠! 폴리? 다행이다… 너는 여기 있었구나.">
      <img src="images/ep01-p03.webp" width="793" height="1983" loading="lazy" alt="3페이지. 폴리가 앞장서고, 윤은 통나무를 건너 숲 너머 루메르를 처음 만난다. 윤: 저 표정… 뭔가 찾았구나. 폴리, 정말 이쪽이야? 여기는… 정말 다른 세상이구나.">
      <img src="images/ep01-p04.webp" width="793" height="1983" loading="lazy" alt="4페이지. 윤과 폴리가 멀리 보이는 마을로 향하다 바위처럼 보이는 거대한 눈을 발견한다. 윤: 저 마을에서 엄마 아빠 소식을 물어보자. 왜? 마을은 저쪽인데. …응?">
      <img src="images/ep01-p05.webp" width="793" height="1983" loading="lazy" alt="5페이지. 마을이 거대한 거북이 등 위에 있음을 알게 된 윤과 폴리가 마을에 오른다. 윤: 마을이… 거북이 위에 있잖아? 주민: 올라올 거면 천천히 와요! 얘, 풀 먹느라 한참 걸려요. 윤: 천천히 오라는 말은 처음 듣네. 폴리, 같이 가!">
    </main>
    <footer><nav aria-label="회차 이동"><a href="../">회차 목록</a> <a href="#top">맨 위로 ↑</a></nav></footer>
  </div>
</body>
</html>
