name: Verify math Pages
on:
  push:
    branches: [main]
    paths:
      - 'math-quiz/**'
      - 'index.html'
      - '.github/workflows/verify-math-pages.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: verify-math-pages
  cancel-in-progress: true
jobs:
  public-url-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check published math page and navigation
        env:
          BASE: https://haruki40-sys.github.io/dungdung_essay
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl --location --silent --show-error --max-time 15 --output "$RUNNER_TEMP/math.html" --write-out '%{http_code}' "$BASE/math-quiz/?v=6.0&check=$GITHUB_RUN_ID" || true)
            echo "Attempt $attempt: math page HTTP $code"
            if [ "$code" = "200" ] && grep -q 'math-release:6.0' "$RUNNER_TEMP/math.html"; then
              home=$(curl --location --silent --show-error --max-time 15 --output "$RUNNER_TEMP/home.html" --write-out '%{http_code}' "$BASE/?check=$GITHUB_RUN_ID" || true)
              if [ "$home" = "200" ] && grep -q 'math-quiz/' "$RUNNER_TEMP/home.html" && grep -q '내신대비 수학' "$RUNNER_TEMP/home.html"; then
                ok=1
                echo 'PASS: math page HTTP 200, release 6.0, homepage HTTP 200, and math navigation present.'
                break
              fi
              echo "Homepage HTTP $home; waiting for matching navigation."
            fi
            sleep 10
          done
          [ "$ok" = "1" ]
          for path in 'math-quiz/index.html' 'hanja-quiz/'; do
            code=$(curl --location --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$BASE/$path?check=$GITHUB_RUN_ID")
            echo "$path HTTP $code"
            [ "$code" = "200" ]
          done
          python3 - <<'PY'
          import os, pathlib, re
          page = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'math.html').read_text()
          assert '<title>내신대비 수학' in page
          assert '출제된 문제 중 잘못된 것이 있을 수도 있습니다.' in page
          assert 'math-release:6.0' in page
          print('PASS: page title, requested notice, and release marker.')
          PY
